<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7F7F7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left red accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#C8102E"/>

  <!-- Top subtle border -->
  <rect x="0" y="0" width="1200" height="1" fill="#E5E5E5"/>
  <rect x="0" y="629" width="1200" height="1" fill="#E5E5E5"/>

  <!-- Logo area — red dot + brand -->
  <circle cx="80" cy="80" r="16" fill="#C8102E"/>
  <text x="108" y="88" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#111111" letter-spacing="-0.3px">openclawhk.io</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Inter, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#111111" letter-spacing="-2px">Eve AI Products</text>

  <!-- Sub headline -->
  <text x="80" y="330" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#555555" letter-spacing="-0.5px">Hong Kong's First OpenClaw AI Solution</text>

  <!-- Divider line -->
  <rect x="80" y="370" width="80" height="3" fill="#C8102E"/>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="80" y="410" width="180" height="40" rx="20" fill="#FEF2F2" stroke="#C8102E" stroke-width="1"/>
  <text x="170" y="436" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#C8102E" text-anchor="middle">Setup Guide $29</text>

  <!-- Pill 2 -->
  <rect x="278" y="410" width="190" height="40" rx="20" fill="#FEF2F2" stroke="#C8102E" stroke-width="1"/>
  <text x="373" y="436" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#C8102E" text-anchor="middle">Eve Persona Pack $79</text>

  <!-- Pill 3 -->
  <rect x="486" y="410" width="170" height="40" rx="20" fill="#FEF2F2" stroke="#C8102E" stroke-width="1"/>
  <text x="571" y="436" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#C8102E" text-anchor="middle">Skill Packs $39–49</text>

  <!-- Bottom tagline -->
  <text x="80" y="540" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#888888">Build your AI employee system — in Chinese, for HK &amp; Asia</text>

  <!-- Right side decoration — abstract geometric -->
  <circle cx="1050" cy="315" r="200" fill="#C8102E" opacity="0.04"/>
  <circle cx="1050" cy="315" r="140" fill="#C8102E" opacity="0.05"/>
  <circle cx="1050" cy="315" r="80" fill="#C8102E" opacity="0.07"/>

  <!-- Mercury Production badge -->
  <text x="1120" y="590" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#AAAAAA" text-anchor="end">by Mercury Production</text>
</svg>
